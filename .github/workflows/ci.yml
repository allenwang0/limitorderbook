name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
          - name: ubuntu-clang-18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: macos-clang
            os: macos-14
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake --preset default -DLOB_WERROR=ON
      - name: Build
        run: cmake --build --preset default
      - name: Test
        run: ctest --preset default
